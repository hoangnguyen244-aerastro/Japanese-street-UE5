; NeoTokyo RTX 3060 Laptop / 6GB VRAM baseline.
; Applies when Engine Scalability > High (quality index 2) is selected.
; Not a guarantee of FPS; benchmark in Standalone before tuning further.
; Does not disable Lumen/reflections, and does not touch binary assets.

[TextureQuality@2]
r.Streaming.PoolSize=1200
r.MaxAnisotropy=8

[PostProcessQuality@2]
r.MotionBlurQuality=0
r.DepthOfFieldQuality=1

; Do not globally force r.Lumen.Reflections.Allow=0.
; Your prior street screenshot measured ~4.5 ms reflections; compare visuals first.
